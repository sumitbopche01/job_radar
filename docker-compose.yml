services:
  db:
    image: pgvector/pgvector:pg17
    container_name: job_radar_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobradar
      POSTGRES_PASSWORD: jobradar
      POSTGRES_DB: jobradar
    ports:
      - "5433:5432"
    volumes:
      - job_radar_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobradar -d jobradar"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  job_radar_pgdata:
